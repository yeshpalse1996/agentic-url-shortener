spring.application.name=agentic-url-shortener

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/agentic_url_shortener
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# Application Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Show SQL parameters (Hibernate 6)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Application package logging
# Replace with your actual Java package
# logging.level.com.yourpackage=DEBUG

# OpenAI API Key
spring.ai.openai.api-key=${OPENAI_API_KEY}


